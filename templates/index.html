<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI WebSocket Chat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 400px;
            text-align: center;
        }
        
        #chat-container {
            display: none;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        
        button {
            width: 100%;
            padding: 10px;
            border: none;
            background: #28a745;
            color: white;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
        }
        
        button:hover {
            background: #218838;
        }

        .chat-box {
            border: 1px solid #ccc;
            height: 250px;
            overflow-y: auto;
            padding: 10px;
            background: #fff;
            border-radius: 5px;
        }

        .message {
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 5px;
        }

        .own-message {
            background: #dcf8c6;
            text-align: right;
        }

        .other-message {
            background: #f1f0f0;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Username Input -->
        <div id="username-container">
            <h2>Enter Your Username</h2>
            <input type="text" id="username" placeholder="Enter your username">
            <button onclick="startChat()">Join Chat</button>
        </div>

        <!-- Chat Interface -->
        <div id="chat-container">
            <h2>WebSocket Chat</h2>
            <div class="chat-box" id="messages"></div>
            <input type="text" id="message" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let ws;
        let username;

        function startChat() {
            username = document.getElementById('username').value.trim();
            if (!username) {
                alert("Please enter a username!");
                return;
            }

            // Hide username input and show chat
            document.getElementById('username-container').style.display = 'none';
            document.getElementById('chat-container').style.display = 'block';

            // Connect to WebSocket server
            ws = new WebSocket('ws://localhost:8000/ws');

            ws.onopen = () => {
                console.log("Connected to WebSocket server");
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const messagesDiv = document.getElementById('messages');

                const newMessage = document.createElement('div');
                newMessage.classList.add('message');

                if (data.client === username) {
                    newMessage.classList.add('own-message');
                } else {
                    newMessage.classList.add('other-message');
                }

                newMessage.innerHTML = `<b>${data.client}</b>: ${data.message}`;
                messagesDiv.appendChild(newMessage);

                // Auto-scroll to the latest message
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            };

            ws.onerror = (error) => {
                console.log(`WebSocket error: ${error}`);
            };

            ws.onclose = () => {
                console.log("WebSocket Connection closed");
            };
        }

        function sendMessage() {
            const messageInput = document.getElementById('message');
            const message = messageInput.value.trim();
            console.log(username, message)
            if (message && ws) {
                ws.send(JSON.stringify({ username: username, content: message }));
                messageInput.value = "";
            }
        }
    </script>

</body>
</html>
